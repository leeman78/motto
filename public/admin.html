<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Motto Wholesale — Admin</title>
<link rel="stylesheet" href="styles.css">
<style>
body{background:#fafafb}
.abar{background:#0c0d0f;color:#fff;padding:0}
.abar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.abar b{font-size:15px;letter-spacing:-.02em}
.abar .tabs{display:flex;gap:4px}
.abar .tabs button{background:none;border:0;color:#8e9198;font-family:inherit;font-size:13px;font-weight:650;padding:8px 14px;border-radius:9px;cursor:pointer}
.abar .tabs button[aria-pressed="true"]{background:#1e2024;color:#fff}
.pane{max-width:1280px;margin:34px auto 90px;padding:0 30px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:18px}
.panel h2{font-size:22px;letter-spacing:-.035em;margin:0 0 4px}
.panel .sub{font-size:13px;color:#8a8d94;margin:0 0 22px;line-height:1.55;max-width:62ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9a9da4;font-weight:700;text-align:left;padding:0 10px 9px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:12px 10px;border-bottom:1px solid #f0f0f2;font-size:13.5px;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f8fa}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.03em}
.pill.ok{background:#e8f6ec;color:#166534}
.pill.warn{background:#fff4e0;color:#8a5a00}
.pill.info{background:#eaf1ff;color:#1a4bb8}
.pill.grey{background:#f0f0f2;color:#71747b}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.priceinput{width:104px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;text-align:right;border:1px solid #e2e2e6;border-radius:9px;padding:8px 10px;outline:none}
  /* A number on its own does not say what it counts. "25" and "200" sat next
     to each other meaning pieces and pieces, but the second one is also
     eight boxes, and that is the number a freight quote needs. */
  /* ---- price table -------------------------------------------------
     Columns were drifting because the unit label sat outside the cell and
     wrapped onto its own line at some widths. Number and unit now share one
     nowrap box with a fixed-width label, so every row lines up whatever the
     value is, and the read-only state occupies exactly the same space as the
     input it replaces. */
  .ptable{width:100%;border-collapse:collapse;table-layout:fixed}
  .ptable th{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:#9a9da4;
    font-weight:800;padding:0 12px 12px 0;border-bottom:1px solid #ececef;text-align:left;white-space:nowrap}
  .ptable th.r{text-align:right}
  .ptable td{padding:11px 12px 11px 0;border-bottom:1px solid #f2f2f4;vertical-align:middle}
  .ptable td.r{text-align:right}
  .ptable tr:last-child td{border-bottom:0}
  .ptable col{}
  /* Ten columns: product, sku, upc, per box, master, cost, wholesale,
     retail, and the two margins. These sum to 100 because table-layout is
     fixed; the old set was written for eight and pushed the last two off the
     edge of the table where they drew on top of each other. */
  .ptable th:nth-child(1),.ptable td:nth-child(1){width:20%}
  .ptable th:nth-child(2),.ptable td:nth-child(2){width:10%}
  .ptable th:nth-child(3),.ptable td:nth-child(3){width:12%}
  .ptable th:nth-child(4),.ptable td:nth-child(4){width:9%}
  .ptable th:nth-child(5),.ptable td:nth-child(5){width:11%}
  .ptable th:nth-child(6),.ptable td:nth-child(6){width:8%}
  .ptable th:nth-child(7),.ptable td:nth-child(7){width:9%}
  .ptable th:nth-child(8),.ptable td:nth-child(8){width:8%}
  .ptable th:nth-child(9),.ptable td:nth-child(9){width:6%}
  .ptable th:nth-child(10),.ptable td:nth-child(10){width:7%}
  .ptable th{font-size:9.5px;letter-spacing:.07em}

  /* Motto's own margin. Tinted because it is the one number on this screen
     that no rep and no store may ever see. */
  /* The price table's widths are written for its ten columns. These two have
     five and three, so they set their own or the last cell is pushed off the
     right edge of the table. */
  .ptable.reps5 th:nth-child(n),.ptable.reps5 td:nth-child(n){width:auto}
  .ptable.reps5{table-layout:auto}
  .ptable.reps5 td:last-child{white-space:nowrap;text-align:right}
  .ptable.reps5 td:last-child .btn{margin-left:6px}
  .ptable.cover3{table-layout:auto}
  .ptable.cover3 th:nth-child(n),.ptable.cover3 td:nth-child(n){width:auto}

  .note{display:flex;align-items:flex-start;gap:14px;margin:16px 0 0;padding:16px 18px;
    border-radius:14px;font-size:13.5px;line-height:1.55;border:1px solid}
  .note.ok{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
  .note.bad{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}
  .note b{display:block;font-size:14.5px;margin-bottom:3px;
    font-family:ui-monospace,Menlo,Consolas,monospace;user-select:all}
  .note span{display:block;opacity:.8;font-size:12.5px}
  .note button{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;
    cursor:pointer;color:inherit;opacity:.5;padding:0 2px}
  .note button:hover{opacity:1}

  .mottom{color:#7c2d12;background:#fff7ed}
  .repm{color:#166534}

  .pname b{display:block;font-size:13.5px;line-height:1.3}
  .pname span{display:block;color:#9a9da4;font-size:11.5px;margin-top:2px}

  /* one line, always: value then unit, unit never wraps under */
  .numcell{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:7px;white-space:nowrap}
  .numcell i{font-style:normal;font-size:11px;color:#9a9da4;
    font-family:ui-monospace,Menlo,Consolas,monospace;width:52px;text-align:left;flex:none}

  /* read-only and editable states share a box so nothing shifts on unlock */
  .ro{display:inline-block;min-width:62px;padding:8px 10px;font-size:13px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#0b0b0d;
    border:1px solid transparent;border-radius:9px}
  .ro.edited{background:#fff7ed}
  .pin{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;color:#0b0b0d;
    border:1px solid #e2e2e6;border-radius:9px;padding:8px 10px;outline:none;background:#fff}
  .pin:focus{border-color:#111}
  .pin.edited{border-color:#f59e0b;background:#fff7ed}

  .pricehead{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px}
  .pricehead .sub{max-width:640px}
  .priceacts{display:flex;gap:8px;flex:none}
  .priceacts .btn[disabled]{opacity:.45;cursor:default}
  .unit{display:inline-block;margin-left:7px;font-size:11px;color:#9a9da4;
    white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
.priceinput:focus{border-color:#111}
.priceinput.over{border-color:var(--blue);background:#f5f8ff;font-weight:700}
.tiny{border:0;background:none;color:#b3b6bd;font-size:11px;font-weight:700;cursor:pointer;padding:4px}
.tiny:hover{color:var(--red)}
.back{border:0;background:none;font-size:13px;font-weight:650;color:#6b6e75;cursor:pointer;padding:0;margin-bottom:14px}
.credbox{background:#0c0d0f;color:#fff;border-radius:18px;padding:22px;margin-top:16px}
.credbox .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8e9198;font-weight:700}
.credbox .v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:19px;font-weight:700;margin:5px 0 16px;user-select:all}
.credbox p{font-size:11.5px;color:#9da0a6;line-height:1.6;margin:0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:22px}
@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}}
.summary div{background:#fff;padding:16px 18px}
.summary .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9a9da4;font-weight:700}
.summary .v{font-size:22px;font-weight:750;letter-spacing:-.03em;margin-top:5px}
</style>
</head>
<body>

<div class="abar"><div class="wrap">
  <b>Motto Wholesale · Admin</b>
  <div class="tabs">
    <button data-tab="dealers" aria-pressed="true">Dealers</button>
    <button data-tab="reps" aria-pressed="false">Reps</button>
    <button data-tab="prices" aria-pressed="false">List prices</button>
    <button data-tab="inventory" aria-pressed="false">Inventory</button>
    <button data-tab="compliance" aria-pressed="false">Compliance</button>
    <button data-tab="copy" aria-pressed="false">Copy</button>
    <button data-tab="orders" aria-pressed="false">Orders</button>
  </div>
  <button class="btn" id="signOut" style="background:#26282d;color:#c9ccd2;padding:8px 14px;font-size:12px">Sign out</button>
</div></div>

<div class="pane" id="pane"></div>

<!-- gate -->
<div class="scrim open" id="gateScrim"></div>
<div class="modal open" id="gateModal" role="dialog" aria-label="Admin sign in">
  <h3>Admin access</h3>
  <p class="msub">Enter your admin code. Eight wrong tries locks this device out for half an hour.</p>
  <div class="f"><label for="tok">Admin code</label><input id="tok" type="password" placeholder="••••••••••••" autocomplete="current-password"></div>
  <label style="display:flex;gap:9px;align-items:center;font-size:13px;color:#6e7077;margin:0 0 16px;cursor:pointer">
    <input type="checkbox" id="remember" checked style="width:16px;height:16px;accent-color:#111">
    Stay signed in on this device
  </label>
  <p class="err" id="gateErr" hidden></p>
  <button class="btn dark" id="gateGo" style="width:100%;padding:14px">Unlock</button>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const usd = c => '$' + (c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cents = s => Math.round(parseFloat(String(s).replace(/[^0-9.]/g,'')) * 100);

// localStorage when the box is ticked, sessionStorage otherwise. Retyping a
// long code every session is what pushes people toward a short one.
let TOKEN = localStorage.getItem('motto_admin') || sessionStorage.getItem('motto_admin') || '';
let tab = 'dealers', dealers = [], view = null;

async function call(action, body = {}){
  const r = await fetch('/api/admin', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-admin-token': TOKEN },
    body: JSON.stringify({ action, ...body })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error || 'Request failed.');
  return d;
}

/* ---------------- gate ---------------- */
$('#gateGo').onclick = async () => {
  const btn = $('#gateGo'), err = $('#gateErr');
  TOKEN = $('#tok').value.trim();
  if(!TOKEN){ err.textContent = 'Enter your admin code.'; err.hidden = false; return; }
  btn.disabled = true; btn.textContent = 'Checking…'; err.hidden = true;
  try{
    await call('list_dealers');
    const store = $('#remember').checked ? localStorage : sessionStorage;
    store.setItem('motto_admin', TOKEN);
    $('#gateScrim').classList.remove('open');
    $('#gateModal').classList.remove('open');
    // Honour a hash that was already in the address bar, so a bookmarked or
    // refreshed screen comes back where it was rather than on Dealers.
    fromHash();
    go(tab, view, true);
  }catch(e){
    err.textContent = e.message || 'That code was not accepted.';
    err.hidden = false;
    $('#tok').value = ''; $('#tok').focus();
  }
  btn.disabled = false; btn.textContent = 'Unlock';
};
$('#tok').addEventListener('keydown', e => { if(e.key==='Enter') $('#gateGo').click(); });

$('#signOut').onclick = () => {
  if(!confirm('Sign out of the admin console?')) return;
  localStorage.removeItem('motto_admin');
  sessionStorage.removeItem('motto_admin');
  location.reload();
};

/* Where you are is kept in the address bar.
   Without this the URL never changes, so Back leaves the admin entirely
   instead of returning to the previous tab, and a refresh drops you on
   Dealers no matter what you were doing. */
function syncTabs(){
  document.querySelectorAll('.tabs button').forEach(x =>
    x.setAttribute('aria-pressed', x.dataset.tab === tab));
}

function go(next, id, replace){
  tab = next; view = id || null;
  const hash = '#' + tab + (view ? '/' + view : '');
  if (location.hash !== hash) {
    history[replace ? 'replaceState' : 'pushState']({ tab, view }, '', hash);
  }
  syncTabs();
  boot();
}

function fromHash(){
  const [t, id] = decodeURIComponent(location.hash.replace(/^#/, '')).split('/');
  const known = [...document.querySelectorAll('.tabs button')].map(b => b.dataset.tab);
  tab = known.includes(t) ? t : 'dealers';
  view = id || null;
  syncTabs();
}

document.querySelectorAll('.tabs button').forEach(b =>
  b.onclick = () => go(b.dataset.tab, null));

// Back and Forward move between screens rather than out of the admin.
window.addEventListener('popstate', () => { fromHash(); boot(); });

async function boot(){
  if(tab === 'dealers')   return view ? dealerDetail(view) : dealerList();
  if(tab === 'reps')      return repList();
  if(tab === 'prices')    return priceList();
  if(tab === 'inventory') return inventoryList();
  if(tab === 'compliance') return complianceList();
  if(tab === 'copy')       return copyList();
  return orderList();
}

/* A result you cannot miss.
   The old confirmation was one line of grey text at the bottom of a long
   panel, which is indistinguishable from not having pressed the button. This
   sits at the top of the screen, stays until dismissed, and can be copied —
   it is often carrying a password somebody has to read out. */
function note(kind, title, detail){
  document.getElementById('note')?.remove();
  const el = document.createElement('div');
  el.id = 'note';
  el.className = 'note ' + kind;
  el.innerHTML = `<div><b>${title}</b>${detail ? `<span>${detail}</span>` : ''}</div>
                  <button aria-label="Dismiss">&times;</button>`;
  el.querySelector('button').onclick = () => el.remove();
  document.querySelector('.wrap').prepend(el);
  el.scrollIntoView({ block: 'nearest' });
}

/* ---------------- reps ----------------
   A rep owns a set of dealers. Assignment decides who sees the account and
   who is copied on its orders from now on; it does not move commission that
   has already been earned, because each order carries the rep it was placed
   under.
*/
async function repList(){
  $('#pane').innerHTML = '<div class="panel"><p class="sub">Loading…</p></div>';
  // Either call can come back empty on a fresh database, so neither result
  // is assumed to have an items array.
  const [repRes, dealerRes] = await Promise.all([
    call('list_reps').catch(() => ({})),
    call('list_dealers').catch(() => ({}))
  ]);
  const items = repRes.items || [];
  // list_dealers answers with `dealers`, not `items`. Accept either so this
  // does not silently render an empty table again.
  const ds    = dealerRes.dealers || dealerRes.items || [];
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

  $('#pane').innerHTML = `
  <div class="summary">
    <div><div class="k">Reps</div><div class="v">${items.length}</div></div>
    <div><div class="k">Active</div><div class="v">${items.filter(r=>r.is_active).length}</div></div>
    <div><div class="k">Dealers assigned</div><div class="v">${ds.filter(d=>d.rep_id).length}</div></div>
    <div><div class="k">Unassigned</div><div class="v" style="color:${ds.filter(d=>!d.rep_id).length?'#b45309':'inherit'}">${ds.filter(d=>!d.rep_id).length}</div></div>
  </div>

  <div class="panel">
    <h2>Add a rep</h2>
    <p class="sub">The rep signs in with this email and is made to replace the password the first time, because you will have read it out to them.</p>
    <div class="formrow" style="margin-top:16px">
      <input id="rName"  placeholder="Full name">
      <input id="rEmail" placeholder="name@mottousa.com">
      <input id="rPhone" placeholder="Phone (optional)">
      <input id="rPass"  placeholder="First password (6+)" style="width:180px">
      <button class="btn dark" id="rAdd">Create rep</button>
    </div>
    <p class="sub" id="rMsg" style="margin-top:12px"></p>
  </div>

  <div class="panel">
    <h2>Reps</h2>
    <table class="ptable reps5">
      <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th class="r">Dealers</th><th class="r">Access</th></tr></thead>
      <tbody>${items.map(r => `<tr>
        <td class="pname"><b>${esc(r.name)}</b><span>${r.must_change_password ? 'Password not changed yet' : 'Signed in before'}</span></td>
        <td><input class="pin" style="width:100%;text-align:left;font-size:12px" data-rmail="${r.id}" value="${esc(r.email)}"></td>
        <td><input class="pin" style="width:100%;text-align:left;font-size:12px" data-rphone="${r.id}" value="${esc(r.phone || '')}" placeholder="Phone"></td>
        <td class="r mono">${r.dealers}</td>
        <td class="r" style="white-space:nowrap">
          <button class="btn soft" data-rpass="${r.id}">Reset password</button>
          <button class="btn soft" data-rlink="${r.id}">Send link</button>
          <button class="btn soft" data-rtog="${r.id}" data-on="${r.is_active}">${r.is_active ? 'Active' : 'Off'}</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="sub">No reps yet.</td></tr>'}
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Who covers whom</h2>
    <p class="sub">Changing this moves the account from now on. Orders already placed keep the rep they were placed under.</p>
    <table class="ptable cover3" style="margin-top:16px">
      <thead><tr><th>Dealer</th><th>Email</th><th>Rep</th></tr></thead>
      <tbody>${ds.map(d => `<tr>
        <td class="pname"><b>${esc(d.business_name)}</b><span>${esc(d.contact_name || '')}</span></td>
        <td class="mono" style="font-size:12px">${esc(d.email || '')}</td>
        <td><select class="pin" data-assign="${d.id}" style="width:190px">
          <option value="">— unassigned —</option>
          ${items.map(r => `<option value="${r.id}"${d.rep_id === r.id ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}
        </select></td>
      </tr>`).join('') || '<tr><td colspan="3" class="sub">No dealers yet.</td></tr>'}
      </tbody>
    </table>
  </div>`;

  $('#rAdd').onclick = async () => {
    const msg = $('#rMsg');
    const body = {
      name: $('#rName').value.trim(),
      email: $('#rEmail').value.trim(),
      phone: $('#rPhone').value.trim(),
    };
    if ($('#rPass').value.trim()) body.password = $('#rPass').value.trim();
    if (!body.name || !body.email) { msg.textContent = 'Name and email are required.'; return; }
    msg.textContent = 'Creating…';
    try {
      const r = await call('create_rep', body);
      note('ok', `${body.email} created. First password: ${r.password}`,
           'Give it to them now. It is stored only as a hash, so it cannot be looked up later.');
      $('#rName').value = $('#rEmail').value = $('#rPhone').value = $('#rPass').value = '';
      await repList();
    } catch (e) { msg.textContent = e.message; }
  };

  const field = (attr, key) => document.querySelectorAll(`[data-${attr}]`).forEach(el =>
    el.onchange = async () => {
      try { await call('set_rep', { id: el.dataset[attr], [key]: el.value.trim() }); $('#rMsg').textContent = 'Saved.'; }
      catch (e) { $('#rMsg').textContent = e.message; }
    });
  field('rmail', 'email');
  field('rphone', 'phone');

  // A password read out on the phone is temporary by definition, so the rep
  // is made to replace it on next sign-in. It is shown once and not stored
  // anywhere readable; if it is lost, reset it again or send a link.
  document.querySelectorAll('[data-rpass]').forEach(el =>
    el.onclick = async () => {
      const chosen = prompt('New password for this rep. Leave blank to generate one.\nMinimum 6 characters.');
      if (chosen === null) return;
      try {
        const body = { id: el.dataset.rpass };
        if (chosen.trim()) body.password = chosen.trim();
        const r = await call('reset_rep_password', body);
        note('ok', `New password: ${r.password}`,
             'Read it to them now. It is stored only as a hash, so nobody can look it up later. They will be asked to change it when they sign in.');
      } catch (e) { $('#rMsg').textContent = e.message; }
    });

  // Sending mail takes a second and produces nothing visible on the page, so
  // the button says what it is doing and the result is stated loudly enough
  // to tell "sent" from "not pressed".
  document.querySelectorAll('[data-rlink]').forEach(el =>
    el.onclick = async () => {
      const label = el.textContent;
      el.disabled = true; el.textContent = 'Sending…';
      try {
        const r = await call('send_rep_link', { id: el.dataset.rlink });
        note('ok', `Sign-in link sent to ${r.sent_to}.`,
             'It works once and expires in 24 hours. If it is not there in a minute, check the junk folder — it arrives from info@mottob2b.com.');
      } catch (e) {
        note('bad', 'The link was not sent.', e.message);
      }
      el.disabled = false; el.textContent = label;
    });

  document.querySelectorAll('[data-rtog]').forEach(el =>
    el.onclick = async () => {
      const on = el.dataset.on !== 'true';
      try { await call('set_rep', { id: el.dataset.rtog, is_active: on }); repList(); }
      catch (e) { $('#rMsg').textContent = e.message; }
    });

  document.querySelectorAll('[data-assign]').forEach(el =>
    el.onchange = async () => {
      try { await call('assign_dealer', { dealer_id: el.dataset.assign, rep_id: el.value || null }); repList(); }
      catch (e) { $('#rMsg').textContent = e.message; }
    });
}

/* ---------------- list prices ----------------
   The table is read-only until it is unlocked. Two reasons.

   A row of open inputs invites a stray keystroke, and every one of these
   numbers is a price somebody gets charged or a part number another table
   points at. The unlock code is not security: anyone holding the admin token
   can already call the API directly. It is a guard against changing a price
   by accident, which is the failure that actually happens.

   Edits are held locally and written in one Save. Saving each field as you
   leave it meant a redraw between every keystroke, which loses your place in
   a nineteen row table.
*/
const EDIT_CODE = '7979';

let priceRows = [];      // last loaded rows
let priceEdits = {};     // sku -> { field: value }
let priceUnlocked = false;

async function priceList(reload = true) {
  if (reload) {
    $('#pane').innerHTML = '<div class="panel"><p class="sub">Loading…</p></div>';
    const { items } = await call('list_products');
    priceRows = items;
    priceEdits = {};
  }
  renderPrices();
}

function renderPrices() {
  const items = priceRows;
  const pending = Object.keys(priceEdits).length;

  // The value to show: a pending edit if there is one, otherwise the stored one.
  const val = (sku, field, fallback) =>
    (priceEdits[sku] && field in priceEdits[sku]) ? priceEdits[sku][field] : fallback;

  // Every price is held per box and quoted per piece, so each one is divided
  // on the way out and multiplied on the way back in.
  const pc = (i, field, col) => {
    const pack = Number(val(i.sku, 'case_pack', i.case_pack)) || 1;
    const stored = i[col] != null ? Math.round(i[col] / (i.case_pack || 1)) : 0;
    return Number(val(i.sku, field, stored)) || 0;
  };
  const costPc   = i => pc(i, 'cost_pc',   'cost_cents');
  const wholePc  = i => pc(i, 'list_pc',   'list_cents');
  const retailPc = i => pc(i, 'retail_pc', 'retail_cents');

  // How many inner boxes make a master carton. Only stated when it divides
  // exactly: a rounded box count is what a freight quote gets built on.
  const boxes = i => {
    const pack = Number(val(i.sku, 'case_pack', i.case_pack)) || 0;
    const mast = Number(val(i.sku, 'master_carton', i.master_carton)) || 0;
    const b = pack > 0 ? mast / pack : 0;
    return Number.isInteger(b) && b > 1 ? b + ' boxes' : '';
  };

  // Two margins, both in dollars per piece rather than percentages, because
  // that is how the price sheet is written and how a rep is settled.
  const mottoM = i => wholePc(i) - costPc(i);      // owner only
  const repM   = i => retailPc(i) - wholePc(i);

  const money = c => (Number(c) / 100).toFixed(2);
  const changed = (sku, field) => priceEdits[sku] && field in priceEdits[sku] ? ' edited' : '';

  const cell = (i, field, shown, opts = {}) => {
    const w = opts.width || 74;
    const align = opts.left ? 'left' : 'right';
    if (!priceUnlocked) {
      return `<span class="ro${changed(i.sku, field)}" style="text-align:${align}">${shown}</span>`;
    }
    return `<input class="pin${changed(i.sku, field)}" style="width:${w}px;text-align:${align}"
      data-sku="${i.sku}" data-field="${field}" value="${shown}" spellcheck="false">`;
  };

  $('#pane').innerHTML = `
  <div class="summary">
    <div><div class="k">SKUs</div><div class="v">${items.length}</div></div>
    <div><div class="k">Priced</div><div class="v">${items.filter(i => i.list_cents > 0).length}</div></div>
    <div><div class="k">Missing UPC</div><div class="v">${items.filter(i => !i.upc).length}</div></div>
    <div><div class="k">Unsaved</div><div class="v" style="color:${pending ? '#b45309' : 'inherit'}">${pending}</div></div>
  </div>

  <div class="panel">
    <div class="pricehead">
      <div>
        <h2>List prices</h2>
        <p class="sub" style="margin:6px 0 0">Every dealer's pricing is derived from these. Retail price is per piece, the way the supplier quotes it; it is multiplied by the box quantity before it is stored. Dealers pinned to a manual price stay where they are.</p>
      </div>
      <div class="priceacts">
        ${priceUnlocked ? `
          <button class="btn dark" id="saveAll" ${pending ? '' : 'disabled'}>Save ${pending ? pending + ' change' + (pending > 1 ? 's' : '') : 'changes'}</button>
          <button class="btn soft" id="cancelAll">Cancel</button>
        ` : `<button class="btn soft" id="unlockEdit">Edit</button>`}
      </div>
    </div>

    <table class="ptable">
      <thead><tr>
        <th>Product</th>
        <th>SKU</th>
        <th>UPC</th>
        <th class="r">Per box</th>
        <th class="r">Master</th>
        <th class="r">Cost / pc</th>
        <th class="r">Wholesale / pc</th>
        <th class="r">Retail / pc</th>
        <th class="r">Motto</th>
        <th class="r">Rep</th>
      </tr></thead>
      <tbody>${items.map(i => {
        return `<tr>
          <td class="pname"><b>${i.products?.name || ''}</b><span>${i.label}</span></td>
          <td>${cell(i, 'sku', val(i.sku, 'sku', i.sku), { width: 104, left: true })}</td>
          <td>${cell(i, 'upc', val(i.sku, 'upc', i.upc || ''), { width: 128, left: true })}</td>
          <td class="r"><span class="numcell">${cell(i, 'case_pack', val(i.sku, 'case_pack', i.case_pack || ''), { width: 62 })}<i>pcs</i></span></td>
          <td class="r"><span class="numcell">${cell(i, 'master_carton', val(i.sku, 'master_carton', i.master_carton || ''), { width: 62 })}<i>${boxes(i) || 'pcs'}</i></span></td>
          <td class="r"><span class="numcell">${cell(i, 'cost_pc', money(costPc(i)), { width: 68 })}<i></i></span></td>
          <td class="r"><span class="numcell">${cell(i, 'list_pc', money(wholePc(i)), { width: 68 })}<i></i></span></td>
          <td class="r"><span class="numcell">${cell(i, 'retail_pc', money(retailPc(i)), { width: 68 })}<i></i></span></td>
          <td class="r mono mottom">${money(mottoM(i))}</td>
          <td class="r mono repm">${money(repM(i))}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
    <p class="sub" style="margin:18px 0 0" id="priceMsg">${priceUnlocked
      ? 'Edits are held here until you press Save. "Margin" is what the retailer keeps at your suggested price.'
      : 'Press Edit to change prices, part numbers or pack sizes.'}</p>
  </div>`;

  if (!priceUnlocked) {
    $('#unlockEdit').onclick = () => {
      const code = prompt('Enter the edit code to unlock pricing.');
      if (code === null) return;
      if (code.trim() !== EDIT_CODE) { $('#priceMsg').textContent = 'That code is not correct.'; return; }
      priceUnlocked = true;
      renderPrices();
    };
    return;
  }

  const cents = v => Math.round(parseFloat(String(v).replace(/[^0-9.]/g, '')) * 100) || 0;

  document.querySelectorAll('.pin').forEach(el => {
    el.oninput = () => {
      const { sku, field } = el.dataset;
      const row = priceRows.find(r => r.sku === sku);
      let v = el.value;

      if (field === 'sku') v = v.trim().toUpperCase();
      else if (field === 'upc') v = v.trim();
      else if (field === 'case_pack' || field === 'master_carton') v = parseInt(v, 10) || 0;
      else v = cents(v);

      // Original value, so backing out an edit clears it rather than storing
      // a "change" that changes nothing.
      // The per-piece fields are stored per box, so compare against the
      // divided value or backing out an edit never clears it.
      const perBox = { cost_pc: 'cost_cents', list_pc: 'list_cents', retail_pc: 'retail_cents' };
      const orig = field === 'sku' ? row.sku
                 : field === 'upc' ? (row.upc || '')
                 : perBox[field]   ? (row.case_pack ? Math.round((row[perBox[field]] || 0) / row.case_pack) : 0)
                 : row[field] || 0;

      priceEdits[sku] = priceEdits[sku] || {};
      if (String(v) === String(orig)) delete priceEdits[sku][field];
      else priceEdits[sku][field] = v;
      if (!Object.keys(priceEdits[sku]).length) delete priceEdits[sku];

      // Only the derived numbers are refreshed, so the caret stays put.
      refreshDerived();
    };
  });

  $('#cancelAll').onclick = () => { priceEdits = {}; priceUnlocked = false; renderPrices(); };
  $('#saveAll').onclick = savePrices;
}

/* Margin, box count and the pending counter follow the inputs without
   redrawing the table, which would move the caret mid-edit. */
function refreshDerived() {
  const n = Object.keys(priceEdits).length;
  const badge = document.querySelectorAll('.summary .v')[3];
  if (badge) { badge.textContent = n; badge.style.color = n ? '#b45309' : ''; }

  const save = $('#saveAll');
  if (save) {
    save.disabled = !n;
    save.textContent = n ? `Save ${n} change${n > 1 ? 's' : ''}` : 'Save changes';
  }

  document.querySelectorAll('.ptable tbody tr').forEach(tr => {
    const skuEl = tr.querySelector('[data-field="sku"]');
    if (!skuEl) return;
    const sku = skuEl.dataset.sku;
    const e = priceEdits[sku] || {};
    const row = priceRows.find(r => r.sku === sku) || {};

    const pack = Number('case_pack' in e ? e.case_pack : row.case_pack) || 0;
    const mast = Number('master_carton' in e ? e.master_carton : row.master_carton) || 0;
    const div = (f, col) => Number('  ' && (f in e ? e[f]
                  : (row.case_pack ? Math.round((row[col] || 0) / row.case_pack) : 0))) || 0;
    const cost   = div('cost_pc',   'cost_cents');
    const whole  = div('list_pc',   'list_cents');
    const retail = div('retail_pc', 'retail_cents');

    const b = pack > 0 ? mast / pack : 0;
    const unit = tr.querySelectorAll('.numcell i')[1];
    if (unit) unit.textContent = Number.isInteger(b) && b > 1 ? b + ' boxes' : 'pcs';

    const fmt = c => (c / 100).toFixed(2);
    const mm = tr.querySelector('.mottom'); if (mm) mm.textContent = fmt(whole - cost);
    const rm = tr.querySelector('.repm');   if (rm) rm.textContent = fmt(retail - whole);

    tr.querySelectorAll('.pin').forEach(el =>
      el.classList.toggle('edited', !!(priceEdits[el.dataset.sku] || {})[el.dataset.field]));
  });
}

async function savePrices() {
  const msg  = $('#priceMsg');
  const save = $('#saveAll');
  const skus = Object.keys(priceEdits);
  if (!skus.length) return;

  save.disabled = true;
  let done = 0;
  const failed = [];

  for (const sku of skus) {
    const e = priceEdits[sku];
    let current = sku;
    try {
      // The rename goes first, so the fields that follow are addressed by the
      // name the row will actually have.
      if (e.sku && e.sku !== sku) {
        const r = await call('set_sku', { sku, new_sku: e.sku });
        current = r.to || e.sku;
      }

      const patch = {};
      if ('upc' in e) patch.upc = e.upc;
      if ('case_pack' in e) patch.case_pack = e.case_pack;
      if ('master_carton' in e) patch.master_carton = e.master_carton;
      if ('msrp_cents' in e) patch.msrp_cents = e.msrp_cents;
      // Back to per box on the way in, using the pack size as it will be
      // after this save rather than as it was loaded.
      const row  = priceRows.find(r => r.sku === sku) || {};
      const pack = ('case_pack' in e ? e.case_pack : row.case_pack) || 1;
      if ('cost_pc'   in e) patch.cost_cents   = e.cost_pc   * pack;
      if ('list_pc'   in e) patch.list_cents   = e.list_pc   * pack;
      if ('retail_pc' in e) patch.retail_cents = e.retail_pc * pack;
      if (Object.keys(patch).length) await call('set_list_price', { sku: current, ...patch });
      done++;
    } catch (err) {
      failed.push(`${sku}: ${err.message}`);
    }
  }

  if (failed.length) {
    msg.textContent = `Saved ${done} of ${skus.length}. ${failed.join(' · ')}`;
    // The successful ones are gone from the server's point of view, so reload
    // rather than leave the screen claiming edits that already landed.
    priceEdits = {};
    await priceList(true);
    $('#priceMsg').textContent = `Saved ${done} of ${skus.length}. ${failed.join(' · ')}`;
    return;
  }

  priceEdits = {};
  priceUnlocked = false;
  await priceList(true);
  $('#priceMsg').textContent = `Saved ${done} SKU${done > 1 ? 's' : ''}.`;
}

/* ---------------- compliance ---------------- */
async function complianceList(){
  $('#pane').innerHTML = '<div class="panel"><p class="sub">Loading…</p></div>';
  const { items } = await call('list_compliance');
  const MARKS = ['FCC','RoHS','CE'];
  const on = i => (i.compliance || []).length;

  $('#pane').innerHTML = `
  <div class="summary">
    <div><div class="k">Products</div><div class="v">${items.length}</div></div>
    <div><div class="k">Marked</div><div class="v">${items.filter(on).length}</div></div>
    <div><div class="k">FCC</div><div class="v">${items.filter(i=>(i.compliance||[]).includes('FCC')).length}</div></div>
    <div><div class="k">RoHS</div><div class="v">${items.filter(i=>(i.compliance||[]).includes('RoHS')).length}</div></div>
  </div>

  <div class="panel">
    <h2>Compliance marks</h2>
    <p class="sub">Only tick a mark once the certificate on file actually lists that product's model number. Claiming FCC on a device that was never tested is a real problem in the US, not a marketing detail — an untested wireless product is the one that gets you a letter. Products with nothing ticked show "Certificates on request" instead, which is honest and costs you nothing.</p>
    <table>
      <thead><tr><th>Product</th><th style="width:90px">FCC</th><th style="width:90px">RoHS</th><th style="width:90px">CE</th><th>Shows as</th></tr></thead>
      <tbody>${items.map(i=>{
        const have = i.compliance || [];
        return `<tr>
          <td><b>${i.name}</b><br><span class="mono" style="color:#9a9da4;font-size:11.5px">${i.slug}</span></td>
          ${MARKS.map(m=>`<td><label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px">
            <input type="checkbox" data-slug="${i.slug}" data-mark="${m}" ${have.includes(m)?'checked':''}
              style="width:16px;height:16px;accent-color:#111;cursor:pointer">${m}</label></td>`).join('')}
          <td style="font-size:12.5px;color:${have.length?'#111':'#9a9da4'}">${have.length ? have.join(' · ') : 'Certificates on request'}</td>
        </tr>`;}).join('')}
      </tbody>
    </table>
    <p class="sub" style="margin:18px 0 0" id="cmMsg">Changes save as you tick.</p>
  </div>`;

  document.querySelectorAll('[data-slug][data-mark]').forEach(box => box.onchange = async () => {
    const slug = box.dataset.slug;
    const marks = [...document.querySelectorAll(`[data-slug="${slug}"]:checked`)].map(x => x.dataset.mark);
    try{
      await call('set_compliance', { slug, compliance: marks });
      $('#cmMsg').textContent = `Saved ${slug}: ${marks.length ? marks.join(', ') : 'none'}.`;
      complianceList();
    }catch(e){ $('#cmMsg').textContent = e.message; box.checked = !box.checked; }
  });
}

          style="width:100%;font:inherit;font-size:13px;padding:9px;border:1px solid #e3e4e7;border-radius:8px">${esc(i.description)}</textarea>

        <label class="k" style="display:block;margin:12px 0 5px">Full description — product page. Blank line between paragraphs.</label>
        <textarea data-f="description_long" data-slug="${esc(i.slug)}" rows="6"
          style="width:100%;font:inherit;font-size:13px;padding:9px;border:1px solid #e3e4e7;border-radius:8px">${esc(i.description_long)}</textarea>

        <label class="k" style="display:block;margin:12px 0 5px">Key features — one per line, leave empty if the source has none</label>
        <textarea data-f="features" data-slug="${esc(i.slug)}" rows="5"
          style="width:100%;font:inherit;font-size:13px;padding:9px;border:1px solid #e3e4e7;border-radius:8px">${esc((i.features||[]).join('\n'))}</textarea>

        <div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:260px">
            <label class="k" style="display:block;margin:0 0 5px">Compatibility — one line</label>
            <input data-f="compatibility" data-slug="${esc(i.slug)}" value="${esc(i.compatibility)}"
              style="width:100%;font:inherit;font-size:13px;padding:9px;border:1px solid #e3e4e7;border-radius:8px">
          </div>
          <div style="width:150px">
            <label class="k" style="display:block;margin:0 0 5px">Weight, oz each</label>
            <input data-f="weight_oz" data-slug="${esc(i.slug)}" value="${i.weight_oz ?? ''}" inputmode="decimal"
              style="width:100%;font:inherit;font-size:13px;padding:9px;border:1px solid #e3e4e7;border-radius:8px">
          </div>
        </div>

        <div style="margin-top:12px;display:flex;align-items:center;gap:12px">
          <button class="btn dark" data-save="${esc(i.slug)}">Save</button>
          <span class="sub" style="margin:0" data-msg="${esc(i.slug)}"></span>
        </div>
      </div>`).join('')}
  </div>`;

  document.querySelectorAll('[data-save]').forEach(btn => btn.onclick = async () => {
    const slug = btn.dataset.save;
    const msg  = document.querySelector(`[data-msg="${slug}"]`);
    const get  = f => document.querySelector(`[data-f="${f}"][data-slug="${slug}"]`).value;
    btn.disabled = true; msg.textContent = 'Saving…';
    try{
      await call('set_detail', {
        slug,
        description:      get('description'),
        description_long: get('description_long'),
        features:         get('features').split('\n').map(s=>s.trim()).filter(Boolean),
        compatibility:    get('compatibility'),
        weight_oz:        get('weight_oz')
      });
      msg.textContent = 'Saved.';
    }catch(e){ msg.textContent = e.message; }
    btn.disabled = false;
  });
}

/* ---------------- inventory ---------------- */
const STOCKS = [
  ['in_stock','In stock','ok'], ['low_stock','Low stock','warn'],
  ['pre_order','Pre-order','info'], ['out_of_stock','Out of stock','warn']
];

async function inventoryList(){
  $('#pane').innerHTML = '<div class="panel"><p class="sub">Loading…</p></div>';
  const { items } = await call('list_inventory');
  const count = k => items.filter(i => i.stock_status === k).length;

  $('#pane').innerHTML = `
  <div class="summary">
    <div><div class="k">Active SKUs</div><div class="v">${items.filter(i=>i.is_active).length}</div></div>
    <div><div class="k">In stock</div><div class="v">${count('in_stock')}</div></div>
    <div><div class="k">Low stock</div><div class="v">${count('low_stock')}</div></div>
    <div><div class="k">Out or pre-order</div><div class="v">${count('out_of_stock')+count('pre_order')}</div></div>
  </div>

  <div class="panel">
    <h2>Availability</h2>
    <p class="sub">What buyers see on the catalog. This is set by hand on purpose. A wrong "in stock" costs you one phone call, but a broken live inventory feed takes down the whole page. Update it when a container lands or a SKU runs dry.</p>
    <table>
      <thead><tr><th>Product</th><th>SKU</th><th class="r">Case</th><th>Availability</th><th>Restock date</th></tr></thead>
      <tbody>${items.map(i=>`
        <tr>
          <td><b>${i.products?.name || ''}</b><br><span style="color:#9a9da4;font-size:11.5px">${i.label}</span></td>
          <td class="mono" style="color:#9a9da4;font-size:11.5px">${i.sku}</td>
          <td class="r mono" style="color:#9a9da4">${i.case_pack}</td>
          <td>
            <select class="priceinput" style="width:145px;text-align:left" data-stock="${i.sku}">
              ${STOCKS.map(([v,l]) => `<option value="${v}"${i.stock_status===v?' selected':''}>${l}</option>`).join('')}
            </select>
          </td>
          <td><input type="date" class="priceinput" style="width:150px;text-align:left" data-restock="${i.sku}" value="${i.restock_date||''}"></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <p class="sub" style="margin:18px 0 0">A product family shows the weakest status of its SKUs. One low-stock length makes the whole card read Low stock, which is what you want: it starts the conversation before the buyer places an order you cannot fill.</p>
  </div>`;

  const save = async sku => {
    const st = document.querySelector(`[data-stock="${sku}"]`).value;
    const rd = document.querySelector(`[data-restock="${sku}"]`).value;
    try{ await call('set_stock', { sku, stock_status: st, restock_date: rd || null }); }
    catch(e){ alert(e.message); }
  };
  document.querySelectorAll('[data-stock]').forEach(el => el.onchange = () => save(el.dataset.stock));
  document.querySelectorAll('[data-restock]').forEach(el => el.onchange = () => save(el.dataset.restock));
}

      <div class="f"><label for="n5">Discount off list</label><input id="n5" type="number" step="0.5" min="0" max="90" value="30"></div>
      <div class="f"><label for="n6">Payment terms</label>
        <select id="n6"><option value="prepay">Prepay (card or ACH at checkout)</option><option value="net15">Net 15 (invoice)</option><option value="net30">Net 30 (invoice)</option></select>
      </div>
    </div>
    <div class="f"><label for="n7">Internal notes</label><input id="n7" placeholder="Met at Dallas show. Wants cables only to start."></div>
    <p class="err" id="newErr" hidden></p>
    <button class="btn dark" id="newGo" style="padding:13px 22px">Create account</button>
    <div id="creds"></div>
  </div>

  <div class="panel">
    <h2>Dealer accounts</h2>
    <p class="sub">Click a row to open that dealer's price sheet.</p>
    <table>
      <thead><tr><th>Business</th><th>Login email</th><th class="r">Discount</th><th class="r">Overrides</th><th>Terms</th><th>Status</th></tr></thead>
      <tbody>${d.map(x=>`
        <tr class="click" data-id="${x.id}">
          <td><b>${x.business_name}</b>${x.contact_name?`<br><span style="color:#9a9da4;font-size:11.5px">${x.contact_name}</span>`:''}</td>
          <td style="color:#71747b">${x.email||'—'}</td>
          <td class="r mono">${Number(x.discount_pct).toFixed(1)}%</td>
          <td class="r">${x.override_count ? `<span class="pill info">${x.override_count} custom</span>` : '<span class="pill grey">none</span>'}</td>
          <td>${x.terms==='prepay'?'<span class="pill grey">Prepay</span>':`<span class="pill warn">${x.terms.toUpperCase()}</span>`}</td>
          <td>${x.approved_at?'<span class="pill ok">Active</span>':'<span class="pill warn">Pending</span>'}
              ${x.must_change_password?'<br><span class="pill warn" style="margin-top:4px;display:inline-block">Temp password</span>':''}</td>
        </tr>`).join('') || '<tr><td colspan="6" style="color:#9a9da4;padding:40px 10px;text-align:center">No dealers yet.</td></tr>'}
      </tbody>
    </table>
  </div>`;

  $('#newGo').onclick = createDealer;
  document.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => go('dealers', tr.dataset.id));
}

async function createDealer(){
  const btn = $('#newGo'), err = $('#newErr');
  err.hidden = true; btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const r = await call('create_dealer', {
      business_name: $('#n1').value.trim(), contact_name: $('#n2').value.trim(),
      email: $('#n3').value.trim(), phone: $('#n4').value.trim(),
      discount_pct: parseFloat($('#n5').value) || 0,
      terms: $('#n6').value, notes: $('#n7').value.trim()
    });
    $('#creds').innerHTML = `
      <div class="credbox">
        <div class="k">Login email</div><div class="v">${r.email}</div>
        <div class="k">Temporary password</div><div class="v">${r.password}</div>
        <p>Send or read this to the dealer now. It is not stored anywhere you can look it up again. They are asked to replace it the first time they sign in, so it only has to get them through one login. If they lose it before then, use Reset password on their detail screen — or tell them to use "Forgot your password?" on the sign-in box and do it themselves.</p>
      </div>`;
    ['#n1','#n2','#n3','#n4','#n7'].forEach(s => $(s).value = '');
    const { dealers: d } = await call('list_dealers'); dealers = d;
  }catch(e){ err.textContent = e.message; err.hidden = false; }
  btn.disabled = false; btn.textContent = 'Create account';
}

/* ---------------- price sheet ---------------- */
async function dealerDetail(id){
  $('#pane').innerHTML = '<div class="panel"><p class="sub">Loading price sheet…</p></div>';
  const { dealer, rows } = await call('price_sheet', { dealer_id: id });

  $('#pane').innerHTML = `
  <button class="back" id="back">← All dealers</button>

  <div class="panel">
    <h2>${dealer.business_name}</h2>
    <p class="sub">${dealer.email || ''} ${dealer.phone ? '· ' + dealer.phone : ''}${dealer.notes ? '<br>' + dealer.notes : ''}</p>
    <div class="cols">
      <div class="f"><label for="d1">Discount off list</label><input id="d1" type="number" step="0.5" min="0" max="90" value="${dealer.discount_pct}"></div>
      <div class="f"><label for="d2">Payment terms</label>
        <select id="d2">
          <option value="prepay"${dealer.terms==='prepay'?' selected':''}>Prepay</option>
          <option value="net15"${dealer.terms==='net15'?' selected':''}>Net 15</option>
          <option value="net30"${dealer.terms==='net30'?' selected':''}>Net 30</option>
        </select>
      </div>
      <div class="f"><label for="d3">Minimum order (dollars)</label><input id="d3" type="number" step="10" value="${(dealer.moq_cents/100).toFixed(0)}"></div>
      <div class="f"><label for="d4">Account status</label>
        <select id="d4"><option value="active"${dealer.approved_at?' selected':''}>Active</option><option value="suspended"${!dealer.approved_at?' selected':''}>Suspended</option></select>
      </div>
    </div>
    <div class="inline">
      <button class="btn dark" id="saveD">Save account</button>
      <button class="btn soft" id="resetP">Reset password</button>
      <button class="btn soft" id="magic">Send sign-in link</button>
      <span id="dMsg" style="font-size:12.5px;color:#8a8d94"></span>
    </div>
    <div id="dCreds"></div>
  </div>

  <div class="panel">
    <h2>Price sheet</h2>
    <p class="sub">Every line starts at list minus ${Number(dealer.discount_pct).toFixed(1)}%. Type a different number in any row to lock that SKU to a manual price — the blue rows are the ones you have overridden. Clear an override and the line goes back to following the discount, so a list price change carries through automatically.</p>
    <table>
      <thead><tr>
        <th>Product</th><th>SKU</th><th class="r">Case</th>
        <th class="r">List</th><th class="r">This dealer pays</th><th class="r">Per piece</th><th></th>
      </tr></thead>
      <tbody>${rows.map(r=>`
        <tr>
          <td><b>${r.product_name}</b><br><span style="color:#9a9da4;font-size:11.5px">${r.label}</span></td>
          <td class="mono" style="color:#9a9da4;font-size:11.5px">${r.sku}</td>
          <td class="r mono" style="color:#9a9da4">${r.case_pack}</td>
          <td class="r mono" style="color:#9a9da4">${usd(r.list_cents)}</td>
          <td class="r"><input class="priceinput${r.is_override?' over':''}" data-sku="${r.sku}" value="${(r.case_cents/100).toFixed(2)}"></td>
          <td class="r mono" style="color:#9a9da4">${usd(Math.round(r.case_cents/r.case_pack))}</td>
          <td class="r">${r.is_override?`<button class="tiny" data-clear="${r.sku}">CLEAR</button>`:''}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <p class="sub" style="margin:18px 0 0">Changes save the moment you leave a field.</p>
  </div>`;

  $('#back').onclick = () => go('dealers', null);

  $('#saveD').onclick = async () => {
    const msg = $('#dMsg'); msg.textContent = 'Saving…';
    try{
      await call('update_dealer', {
        dealer_id: id,
        discount_pct: parseFloat($('#d1').value) || 0,
        terms: $('#d2').value,
        moq_cents: Math.round((parseFloat($('#d3').value)||500) * 100),
        approved_at: $('#d4').value === 'active' ? new Date().toISOString() : null
      });
      msg.textContent = 'Saved.';
      dealerDetail(id);
    }catch(e){ msg.textContent = e.message; }
  };

  $('#resetP').onclick = async () => {
    if(!confirm('Generate a new password for this dealer? Their current one stops working immediately.')) return;
    const r = await call('reset_password', { dealer_id: id });
    $('#dCreds').innerHTML = `<div class="credbox"><div class="k">New password</div><div class="v">${r.password}</div>
      <p>Send or read it to them now. This is the only time it is shown, and they will be asked to replace it the moment they sign in.</p></div>`;
  };

  $('#magic').onclick = async () => {
    const msg = $('#dMsg'); msg.textContent = 'Sending…';
    try{
      const r = await call('send_magic_link', { email: dealer.email, business_name: dealer.business_name });
      msg.textContent = r.sent_to
        ? `Sign-in link handed to Resend for ${r.sent_to}. It should show in your Resend dashboard within seconds. Tell them to check junk if it is not in the inbox shortly.`
        : 'The link was generated but no email was sent — RESEND_API_KEY is not set in Vercel.';
    }catch(e){ msg.textContent = 'Not sent: ' + e.message; }
  };

  document.querySelectorAll('.priceinput').forEach(inp => {
    inp.onchange = async () => {
      const v = cents(inp.value);
      if(!Number.isInteger(v) || v < 0){ inp.value = '0.00'; return; }
      inp.disabled = true;
      try{ await call('set_price', { dealer_id: id, sku: inp.dataset.sku, case_cents: v }); dealerDetail(id); }
      catch(e){ alert(e.message); inp.disabled = false; }
    };
  });

  document.querySelectorAll('[data-clear]').forEach(b => {
    b.onclick = async () => {
      await call('clear_price', { dealer_id: id, sku: b.dataset.clear });
      dealerDetail(id);
    };
  });
}

/* ---------------- orders ---------------- */
async function orderList(){
  $('#pane').innerHTML = '<div class="panel"><p class="sub">Loading…</p></div>';
  const { orders } = await call('list_orders');
  const paid = orders.filter(o => o.status === 'paid');
  const rev  = paid.reduce((s,o) => s + (o.total_cents || 0), 0);

  const pill = s => ({
    paid:'ok', shipped:'ok', processing:'warn', pending:'grey',
    abandoned:'grey', payment_failed:'warn', refunded:'warn'
  })[s] || 'grey';

  $('#pane').innerHTML = `
  <div class="summary">
    <div><div class="k">Orders</div><div class="v">${orders.length}</div></div>
    <div><div class="k">Paid</div><div class="v">${paid.length}</div></div>
    <div><div class="k">Awaiting payment</div><div class="v">${orders.filter(o=>o.status==='processing'||o.status==='pending').length}</div></div>
    <div><div class="k">Paid revenue</div><div class="v">${usd(rev)}</div></div>
  </div>
  <div class="panel">
    <h2>Recent orders</h2>
    <p class="sub">ACH settles a few business days after checkout, so an ACH order sits at Processing until the webhook clears it. Do not ship on Processing.</p>
    <table>
      <thead><tr><th>#</th><th>Dealer</th><th>Placed</th><th class="r">Total</th><th>Pay</th><th>Status</th><th>Tracking</th></tr></thead>
      <tbody>${orders.map(o=>`
        <tr>
          <td class="mono">${o.order_no}</td>
          <td><b>${o.dealer_accounts?.business_name || o.customer_name || '—'}</b><br><span style="color:#9a9da4;font-size:11.5px">${(o.order_items||[]).length} lines</span></td>
          <td style="color:#71747b;font-size:12.5px">${new Date(o.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td>
          <td class="r mono">${usd(o.total_cents || o.subtotal_cents + o.freight_cents)}</td>
          <td style="font-size:11.5px;color:#71747b">${o.payment_method==='card'?'Card':'ACH'}</td>
          <td><span class="pill ${pill(o.status)}">${o.status}</span></td>
          <td><input class="priceinput" style="width:130px;text-align:left" data-order="${o.id}" value="${o.tracking||''}" placeholder="Add tracking"></td>
        </tr>`).join('') || '<tr><td colspan="7" style="color:#9a9da4;padding:40px 10px;text-align:center">No orders yet.</td></tr>'}
      </tbody>
    </table>
  </div>`;

  document.querySelectorAll('[data-order]').forEach(inp => {
    inp.onchange = async () => {
      await call('update_order', {
        order_id: inp.dataset.order,
        tracking: inp.value.trim(),
        status: inp.value.trim() ? 'shipped' : undefined
      });
      orderList();
    };
  });
}

if(TOKEN){
  $('#tok').value = TOKEN;
  $('#gateGo').click();
}
</script>
</body>
</html>
