<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rep portal | Motto Wholesale</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --ink:#0b0b0d; --ink-2:#5f6268; --ink-3:#9a9da4;
  --line:#e7e7ea; --soft:#f5f5f7; --panel:#0c0d0f; --blue:#1268ff;
  --good:#166534; --warn:#b45309;
}
*{box-sizing:border-box}
body{margin:0;background:#fafafb;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:auto;padding:0 26px}

.top{background:var(--panel);color:#fff}
.topin{display:flex;align-items:center;gap:18px;height:62px}
.topin b{font-size:15px;font-weight:700}
.topin .who{margin-left:auto;font-size:12.5px;color:#a7abb2}
.btn{border:0;border-radius:999px;padding:10px 17px;font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.dark{background:var(--ink);color:#fff}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.btn[disabled]{opacity:.45;cursor:default}

.tabs{display:flex;gap:6px;padding:14px 0 0}
.tabs button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:650;color:var(--ink-2);
  padding:9px 15px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}

.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0}
.sub{font-size:13px;line-height:1.6;color:var(--ink-2);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:16px 0}
.stats > div{background:#fff;padding:20px}
.stats .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin-bottom:7px}
.stats .v{font-size:25px;font-weight:750;letter-spacing:-.03em}
.stats .n{font-size:11.5px;color:var(--ink-3);margin-top:5px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;
  color:var(--ink-3);padding:0 12px 11px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:12px 12px 12px 0;border-bottom:1px solid #f2f2f4;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#fafafb}
.nm b{display:block;font-size:13.5px}
.nm span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.pill{display:inline-block;font-size:10.5px;font-weight:750;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.pill.ok{background:#e7f6ec;color:var(--good)}
.pill.warn{background:#fff7ed;color:var(--warn)}
.margin{color:var(--good);font-weight:700}
.pin{font-family:ui-monospace,Menlo,monospace;font-size:13px;text-align:right;
  border:1px solid #e2e2e6;border-radius:9px;padding:8px 10px;width:92px;outline:none}
.pin:focus{border-color:#111}
.pin.q{border-color:#f59e0b;background:#fff7ed}
.obar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  margin-top:16px;padding:13px 16px;background:var(--soft);border-radius:12px;font-size:13.5px}
.ea{display:block;font-size:11px;color:var(--ink-3);font-weight:400;margin-top:2px}
.quoted{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--warn);background:#fff7ed;padding:2px 7px;border-radius:999px;margin-top:3px}
.msg{font-size:12.5px;color:var(--ink-2);margin-top:12px;min-height:18px}

.gate{position:fixed;inset:0;background:rgba(10,10,12,.55);display:grid;place-items:center;z-index:80}
/* The password prompt outranks the sign-in box. They are both full-screen
   layers, and whichever is later in the document would otherwise win on
   stacking order alone and swallow the clicks meant for the other. */
#pwgate{z-index:90}
.gate[hidden]{display:none !important}
.card{background:#fff;border-radius:20px;padding:30px;width:min(400px,92vw)}
.card h2{font-size:20px;margin-bottom:6px}
.card label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:800;color:var(--ink-3);margin:16px 0 6px}
.card input{width:100%;font:inherit;font-size:14px;padding:12px 13px;border:1px solid #e2e2e6;border-radius:11px;outline:none}
.card input:focus{border-color:#111}
.err{color:#b42318;font-size:12.5px;margin-top:12px;min-height:17px}
.back{font-size:12.5px;color:var(--ink-2);cursor:pointer;display:inline-block;margin-bottom:14px}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.topin{gap:10px}}
</style>
</head>
<body>

<div class="top"><div class="wrap topin">
  <b>Motto Wholesale · Rep</b>
  <span class="who" id="who"></span>
  <button class="btn line" id="out" hidden>Sign out</button>
</div></div>

<div class="wrap">
  <div class="tabs" id="tabs" hidden>
    <button data-tab="home" aria-pressed="true">Overview</button>
    <button data-tab="accounts" aria-pressed="false">My accounts</button>
    <button data-tab="orders" aria-pressed="false">Orders</button>
  </div>
  <div id="pane"></div>
</div>

<div class="gate" id="pwgate" hidden>
  <div class="card">
    <h2>Choose a password</h2>
    <p class="sub">The one you were given was read out to you, so it is not private. Pick your own before going any further.</p>
    <label for="np">New password</label>
    <input id="np" type="password" autocomplete="new-password" placeholder="At least 8 characters">
    <label for="np2">Type it again</label>
    <input id="np2" type="password" autocomplete="new-password">
    <p class="err" id="perr"></p>
    <button class="btn dark" id="pgo" style="width:100%;padding:14px;margin-top:6px">Save and continue</button>
  </div>
</div>

<div class="gate" id="gate">
  <div class="card">
    <h2>Rep sign in</h2>
    <p class="sub">Use the email and password you were given. You will be asked to change the password the first time.</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" placeholder="name@mottousa.com">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="gerr"></p>
    <button class="btn dark" id="go" style="width:100%;padding:14px;margin-top:6px">Sign in</button>
  </div>
</div>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

const $ = s => document.querySelector(s);
const usd = c => '$' + ((c || 0) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let sb = null, session = null, tab = 'home', open = null;

async function client() {
  if (sb) return sb;
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return sb;
}

// Every call carries the access token. The server resolves the rep from it
// and scopes the query; the browser never says which rep it is.
async function call(action, body = {}) {
  const r = await fetch('/api/rep', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ action, ...body })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
  return j;
}

/* ---------------- sign in ---------------- */
$('#go').onclick = async () => {
  const c = await client();
  $('#gerr').textContent = '';
  const { data, error } = await c.auth.signInWithPassword({
    email: $('#em').value.trim(), password: $('#pw').value
  });
  if (error) { $('#gerr').textContent = 'That email and password did not match.'; return; }
  session = data.session;
  await start();
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });

$('#out').onclick = async () => { (await client()).auth.signOut(); location.reload(); };

async function start() {
  let me;
  try {
    me = await call('summary');
  } catch (e) {
    // Signing in works for dealers too, so a dealer landing here gets a clear
    // answer rather than an empty screen.
    $('#gerr').textContent = 'That account is not a rep account.';
    (await client()).auth.signOut();
    session = null;
    return;
  }
  $('#gate')?.remove();
  $('#who').textContent = me.rep.name;

  // A password handed over on the phone stops being a secret the moment it is
  // spoken. Nothing else on this screen opens until it has been replaced,
  // including by way of a magic link, which is otherwise a way straight past
  // the prompt.
  if (me.rep.must_change_password) return forceNewPassword(me);

  $('#pwgate').hidden = true;
  $('#tabs').hidden = false;
  $('#out').hidden = false;
  render(me);
}

function forceNewPassword(me) {
  // The sign-in box is another full-screen layer. If it is still in the
  // document it sits on top of this one and silently eats every click, which
  // looks exactly like a broken button: no error, nothing happens. Remove it
  // rather than hide it, so there is nothing left to intercept.
  document.getElementById('gate')?.remove();
  $('#pwgate').hidden = false;
  $('#out').hidden = false;
  $('#np').focus();
}

// Bound once, on the document, rather than on the button. An onclick assigned
// inside a render function is lost the moment anything redraws, and start()
// can legitimately run twice when a magic link restores a session. This
// cannot come unbound.
document.addEventListener('click', async (ev) => {
  if (ev.target.id !== 'pgo') return;
  const err = $('#perr'), btn = $('#pgo');
  {
    const a = $('#np').value, b = $('#np2').value;
    err.textContent = '';
    // Eight rather than Supabase's six: this one is chosen, not dictated over
    // a phone line, so there is no reason to accept a weak one.
    if (a.length < 8)  { err.textContent = 'Use at least 8 characters.'; return; }
    if (a !== b)       { err.textContent = 'Those two do not match.'; return; }

    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const c = await client();
      // A dead session makes updateUser hang rather than reject, which shows
      // up as a button stuck on "Saving…" with no error anywhere. Magic-link
      // sessions are short and single use, so this is the common case, not an
      // edge one. Time it out and say what to do about it.
      const { error } = await Promise.race([
        c.auth.updateUser({ password: a }),
        new Promise((_, no) => setTimeout(
          () => no(new Error('Your sign-in has expired. Sign in with your email and password on this page, then change it here.')), 12000))
      ]);
      if (error) throw new Error(error.message);
    } catch (e) {
      // Only the password change itself belongs in this catch. Anything after
      // it has already succeeded, and treating a rendering slip as a failed
      // save left the button greyed out with no message, which reads as the
      // screen having frozen.
      err.textContent = e.message || 'That did not save. Try again.';
      btn.disabled = false;
      btn.textContent = 'Save and continue';
      if (/expired|session/i.test(e.message || '')) {
        // Nothing on this screen can succeed without a live session, so send
        // them back to the one thing that can fix it.
        try { (await client()).auth.signOut(); } catch (_) {}
        setTimeout(() => location.reload(), 2500);
      }
      return;
    }

    // Past this point the password is changed. The gate comes down first, so
    // a later hiccup cannot trap someone behind a prompt they have satisfied.
    $('#pwgate').hidden = true;
    $('#tabs').hidden = false;
    $('#out').hidden = false;
    btn.disabled = false;
    btn.textContent = 'Save and continue';

    try { await call('password_changed'); }
    catch (e) { console.error('could not clear the change-password flag', e); }

    try { render(await call('summary')); }
    catch (e) {
      $('#pane').innerHTML = `<div class="panel"><h2>Password saved</h2>
        <p class="sub" style="margin-top:8px">Your new password is in place. Reload the page to load your accounts.</p></div>`;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'np2') $('#pgo').click();
});

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; open = null;
  document.querySelectorAll('#tabs button').forEach(x =>
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  route();
});

async function route() {
  $('#pane').innerHTML = '<div class="panel"><p class="sub">Loading…</p></div>';
  if (tab === 'home')     return render(await call('summary'));
  if (tab === 'accounts') return open ? account(open) : accounts();
  if (tab === 'orders')   return orders();
}

/* ---------------- overview ---------------- */
function render(me) {
  const t = me.this_month, l = me.last_month;
  const delta = l.margin_cents ? Math.round((t.margin_cents - l.margin_cents) / l.margin_cents * 100) : null;

  $('#pane').innerHTML = `
  <div class="stats">
    <div><div class="k">My accounts</div><div class="v">${me.dealers}</div></div>
    <div><div class="k">This month</div><div class="v">${usd(t.margin_cents)}</div>
      <div class="n">my margin on ${t.orders} paid order${t.orders === 1 ? '' : 's'}</div></div>
    <div><div class="k">Last month</div><div class="v">${usd(l.margin_cents)}</div>
      <div class="n">${delta === null ? 'no comparison yet' : (delta >= 0 ? '+' : '') + delta + '% since'}</div></div>
    <div><div class="k">Outstanding</div><div class="v" style="color:${me.outstanding_cents ? 'var(--warn)' : 'inherit'}">${usd(me.outstanding_cents)}</div>
      <div class="n">invoices sent, not yet paid</div></div>
  </div>

  <div class="panel">
    <h2>How your margin is worked out</h2>
    <p class="sub" style="margin-top:8px">
      Your stores are invoiced at the price you quoted them. You owe Motto the wholesale
      price on the same boxes. The difference is yours, and it is counted in the month the
      store's payment lands, not when the order is placed.</p>
    <p class="sub" style="margin-top:14px">
      This month: stores were charged <b>${usd(t.retail_cents)}</b>,
      wholesale on that is <b>${usd(t.wholesale_cents)}</b>,
      leaving <b class="margin">${usd(t.margin_cents)}</b>.</p>
  </div>`;
}

/* ---------------- my accounts ---------------- */
async function accounts() {
  const { items } = await call('dealers');
  $('#pane').innerHTML = `
  <div class="panel">
    <h2>My accounts</h2>
    <p class="sub" style="margin-top:6px">Open an account to set its prices.</p>
    <table style="margin-top:18px">
      <thead><tr><th>Business</th><th>Contact</th><th class="r">Orders</th>
        <th class="r">Paid to date</th><th class="r">Outstanding</th><th class="r">Last order</th></tr></thead>
      <tbody>${items.length ? items.map(d => `<tr class="click" data-open="${d.id}">
        <td class="nm"><b>${esc(d.business_name)}</b><span>${esc(d.email || '')}</span></td>
        <td>${esc(d.contact_name || '')}</td>
        <td class="r mono">${d.orders_all_time}</td>
        <td class="r mono">${usd(d.paid_subtotal_cents)}</td>
        <td class="r mono" style="color:${d.outstanding_cents ? 'var(--warn)' : 'var(--ink-3)'}">${usd(d.outstanding_cents)}</td>
        <td class="r mono" style="color:var(--ink-3)">${d.last_order_at ? d.last_order_at.slice(0, 10) : '—'}</td>
      </tr>`).join('') : '<tr><td colspan="6" class="sub">No accounts assigned to you yet.</td></tr>'}
      </tbody>
    </table>
  </div>`;
  document.querySelectorAll('[data-open]').forEach(tr =>
    tr.onclick = () => { open = tr.dataset.open; account(open); });
}

/* ---------------- one account ---------------- */
async function account(id) {
  const { dealer, prices, orders } = await call('dealer', { dealer_id: id });

  $('#pane').innerHTML = `
  <span class="back" id="back">← My accounts</span>
  <div class="panel">
    <h2>${esc(dealer.business_name)}</h2>
    <p class="sub" style="margin-top:6px">${esc(dealer.contact_name || '')} · ${esc(dealer.email || '')} · ${esc(dealer.phone || '')}</p>
  </div>

  <div class="panel">
    <h2>Prices for this account</h2>
    <p class="sub" style="margin-top:6px">
      What this store pays and what you keep on it, per box and per piece.
      Prices are set by Motto: call or email to have one changed for this account.</p>
    <table style="margin-top:18px">
      <thead><tr><th>Product</th><th>SKU</th><th class="r">Per box</th>
        <th class="r">Wholesale</th><th class="r">This store pays</th><th class="r">My margin</th>
        <th class="r" style="width:82px">Order</th></tr></thead>
      <tbody>${prices.map(r => `<tr>
        <td class="nm"><b>${esc(r.product)}</b><span>${esc(r.label)}</span></td>
        <td class="mono" style="font-size:12px;color:var(--ink-3)">${esc(r.sku)}</td>
        <td class="r mono">${r.case_pack}</td>
        <td class="r mono" style="color:var(--ink-3)">${usd(r.wholesale_cents)}<br>
          <span class="ea">${usd(Math.round(r.wholesale_cents / (r.case_pack || 1)))} each</span></td>
        <td class="r mono"><b>${usd(r.charged_cents)}</b><br>
          <span class="ea">${usd(Math.round(r.charged_cents / (r.case_pack || 1)))} each</span>
          ${r.is_quoted ? '<br><span class="quoted">special price</span>' : ''}</td>
        <td class="r mono margin">${usd(r.margin_cents)}<br>
          <span class="ea">${usd(Math.round(r.margin_cents / (r.case_pack || 1)))} each</span></td>
        <td class="r"><input class="pin oq" data-sku="${r.sku}" data-name="${esc(r.product)} — ${esc(r.label)}"
          data-cents="${r.charged_cents}" data-margin="${r.margin_cents}" data-pack="${r.case_pack}"
          type="number" min="0" step="1" placeholder="0" style="width:64px"></td>
      </tr>`).join('')}
      </tbody>
    </table>
    <div class="obar" id="obar" hidden>
      <div>
        <b class="mono" id="oTot">$0.00</b> <span style="color:var(--ink-3)">order total</span>
        <span style="color:var(--ink-3)"> · you make </span><b class="mono margin" id="oMar">$0.00</b>
      </div>
      <button class="btn dark" id="oReview">Review order →</button>
    </div>
    <p class="msg" id="pmsg"></p>
  </div>

  <div class="panel" id="oPanel" hidden></div>

  <div class="panel">
    <h2>Recent orders</h2>
    <table style="margin-top:18px">
      <thead><tr><th>Order</th><th>Status</th><th class="r">Total</th><th class="r">Placed</th></tr></thead>
      <tbody>${orders.length ? orders.map(o => `<tr>
        <td class="mono">#${o.order_no}</td>
        <td><span class="pill ${o.status === 'paid' ? 'ok' : ''}">${o.status}</span></td>
        <td class="r mono">${usd(o.total_cents)}</td>
        <td class="r mono" style="color:var(--ink-3)">${o.created_at.slice(0, 10)}</td>
      </tr>`).join('') : '<tr><td colspan="4" class="sub">No orders yet.</td></tr>'}
      </tbody>
    </table>
  </div>`;

  $('#back').onclick = () => { open = null; accounts(); };

  // ---- order builder ----
  // Freight mirrors the site rule: free at $1,500, else $18 flat.
  const chosen = () => [...document.querySelectorAll('.oq')]
    .map(i => ({ sku: i.dataset.sku, name: i.dataset.name, pack: +i.dataset.pack,
                 cents: +i.dataset.cents, margin: +i.dataset.margin,
                 cases: Math.max(0, parseInt(i.value, 10) || 0) }))
    .filter(x => x.cases > 0);

  const oTotals = () => {
    const c = chosen();
    const sub = c.reduce((s, x) => s + x.cents * x.cases, 0);
    const mar = c.reduce((s, x) => s + x.margin * x.cases, 0);
    const fr = sub === 0 ? 0 : (sub >= 150000 ? 0 : 1800);
    $('#obar').hidden = c.length === 0;
    $('#oTot').textContent = usd(sub + fr);
    $('#oMar').textContent = usd(mar);
    return { c, sub, fr, mar };
  };
  document.querySelectorAll('.oq').forEach(i => i.oninput = oTotals);

  $('#oReview').onclick = () => {
    const { c, sub, fr, mar } = oTotals();
    if (!c.length) return;
    const panel = $('#oPanel');
    panel.hidden = false;
    panel.innerHTML = `
      <h2>Review order — ${esc(dealer.business_name)}</h2>
      <p class="sub" style="margin-top:6px">This is exactly what lands in their inbox, with an
      approve-and-pay button. They pay Motto directly — bank (ACH) or card, their choice.</p>
      <table style="margin-top:18px">
        <thead><tr><th>Item</th><th class="r">Boxes</th><th class="r">Per box</th><th class="r">Amount</th></tr></thead>
        <tbody>
          ${c.map(x => `<tr>
            <td class="nm"><b>${x.name}</b><span class="mono">${esc(x.sku)} · ${x.pack * x.cases} pcs</span></td>
            <td class="r mono">${x.cases}</td>
            <td class="r mono">${usd(x.cents)}</td>
            <td class="r mono">${usd(x.cents * x.cases)}</td>
          </tr>`).join('')}
          <tr><td colspan="3" style="border:0;padding-top:12px">Subtotal</td><td class="r mono" style="border:0;padding-top:12px">${usd(sub)}</td></tr>
          <tr><td colspan="3" style="border:0">Ground freight</td><td class="r mono" style="border:0">${fr ? usd(fr) : 'Free'}</td></tr>
          <tr><td colspan="3" style="border:0;font-weight:800;font-size:15px">Total</td><td class="r mono" style="border:0;font-weight:800;font-size:15px">${usd(sub + fr)}</td></tr>
          <tr><td colspan="3" style="border:0;color:var(--ink-3)">Your margin on this order</td><td class="r mono margin" style="border:0">${usd(mar)}</td></tr>
        </tbody>
      </table>
      <div style="display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap">
        <button class="btn dark" id="oSend">Send to ${esc(dealer.email)} for approval</button>
        <button class="btn soft" id="oEdit">← Edit</button>
        <span class="msg" id="oMsg" style="margin:0"></span>
      </div>`;
    panel.scrollIntoView({ behavior: 'smooth' });

    $('#oEdit').onclick = () => { panel.hidden = true; };
    $('#oSend').onclick = async () => {
      const btn = $('#oSend');
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const o = await call('create_order', { dealer_id: id, items: c.map(x => ({ sku: x.sku, cases: x.cases })) });
        const r = await call('send_pay_link', { order_id: o.order_id });
        panel.innerHTML = `
          <h2>Order #${o.order_no} sent</h2>
          <p class="sub" style="margin-top:6px"><b>${usd(o.total_cents)}</b> — the approve-and-pay
          email is on its way to <b>${esc(r.sent_to)}</b>. When they pay, it shows under
          Recent orders and on your dashboard, with your margin of ${usd(mar)} credited to you.</p>
          <button class="btn soft" style="margin-top:14px" id="oDone">Done</button>`;
        $('#oDone').onclick = () => account(id);
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Send to ' + dealer.email + ' for approval';
        $('#oMsg').textContent = e.message;
      }
    };
  };
}

/* ---------------- orders ---------------- */
async function orders() {
  const { items } = await call('orders');
  $('#pane').innerHTML = `
  <div class="panel">
    <h2>Orders</h2>
    <p class="sub" style="margin-top:6px">Every order from your accounts. Margin is counted once the order is paid.</p>
    <table style="margin-top:18px">
      <thead><tr><th>Order</th><th>Account</th><th>Status</th>
        <th class="r">Charged</th><th class="r">Wholesale</th><th class="r">My margin</th><th class="r">Placed</th></tr></thead>
      <tbody>${items.length ? items.map(o => `<tr>
        <td class="mono">#${o.order_no}</td>
        <td>${esc(o.dealer_accounts?.business_name || '')}</td>
        <td><span class="pill ${o.status === 'paid' ? 'ok' : (o.status === 'requested' ? 'warn' : '')}">${o.status}</span></td>
        <td class="r mono">${usd(o.retail_cents)}</td>
        <td class="r mono" style="color:var(--ink-3)">${usd(o.wholesale_cents)}</td>
        <td class="r mono ${o.status === 'paid' ? 'margin' : ''}" style="${o.status === 'paid' ? '' : 'color:var(--ink-3)'}">${usd(o.margin_cents)}</td>
        <td class="r mono" style="color:var(--ink-3)">${o.created_at.slice(0, 10)}</td>
      </tr>`).join('') : '<tr><td colspan="7" class="sub">No orders yet.</td></tr>'}
      </tbody>
    </table>
  </div>`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

// A magic link arrives with the session in the URL fragment, and the client
// needs a moment to trade that for a session. Asking getSession() straight
// away answers null, which is why arriving by link left the screen half
// built. onAuthStateChange fires once the exchange is done, so wait for it.
(async () => {
  const c = await client();
  let started = false;
  const begin = async (sess) => {
    if (started || !sess) return;
    started = true;
    session = sess;
    await start();
  };

  // Wrapped because one failing call here would take the rest of the startup
  // with it, and what is left is a page that renders but does nothing.
  try { c.auth.onAuthStateChange?.((_e, sess) => { begin(sess); }); }
  catch (e) { console.error('auth listener unavailable', e); }

  try {
    const { data } = await c.auth.getSession();
    if (data?.session) await begin(data.session);
  } catch (e) { console.error('could not read the session', e); }
})();
</script>
